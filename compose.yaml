name: ugmk-meetings
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/configure.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS portal address}
      SETTINGS_KEY: ${SETTINGS_KEY:?Run deploy/configure.py first}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Run deploy/configure.py first}
      AD_CA_FILE: /etc/ssl/certs/ad-ca.pem
      COOKIE_SECURE: "true"
    volumes:
      - ./deploy/certs/ad-ca.pem:/etc/ssl/certs/ad-ca.pem:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data:
