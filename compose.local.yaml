# Local development only: database and backend remain unpublished.
services:
  app:
    environment:
      PUBLIC_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      ALLOW_INSECURE_LOCALHOST: "true"
  proxy:
    ports: !override
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
